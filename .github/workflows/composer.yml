name: CI

on:
  push:
    branches: [ 1.12-dev ]
  pull_request:
    branches: [ 1.12-dev ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.4', '8.5', '8.6' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, gd, mysqli
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Lint PHP syntax
        run: find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Verify release package build
        run: composer run-script xmb:build

      - name: Set build metadata and unpack archive
        if: matrix.php-version == '8.4'
        id: build-meta
        env:
          FULL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "name=xmb-build-$(date -u +%Y%m%d)-${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          mkdir -p artifact_staging
          unzip -q xmb-*.zip -d artifact_staging

      - name: Upload build artifact
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-meta.outputs.name }}
          path: artifact_staging/
          if-no-files-found: error
          retention-days: 14
